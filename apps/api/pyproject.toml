[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aarogya-api"
version = "0.1.0"
description = "FastAPI agent backend for Aarogya Atlas: trust-scored, cost-aware healthcare-facility search over the Virtue Foundation India dataset."
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "groq>=0.13.0",
    "asyncpg>=0.31.0",
    "databricks-sdk>=0.105.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "jsonschema>=4.23",
    "mlflow>=2.22",
    "ollama>=0.6.1",
    "openpyxl>=3.1.5",
    "pandas<3",
    "pydantic>=2",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "setuptools>=78.1.1",
    "sqlalchemy[asyncio]>=2.0.49",
    "uvicorn[standard]>=0.46.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
]

# Mirror of the `dev` extra for `uv sync` (uv installs dependency groups by
# default; pip installs extras via `pip install -e ".[dev]"`). Keep in sync.
[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.15",
]

[tool.hatch.build.targets.wheel]
packages = ["aarogya_api"]

[tool.hatch.build.targets.sdist]
include = ["aarogya_api", "db", "tests", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
